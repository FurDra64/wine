name: build

# Wine WOW64 ビルド検証 (合否のみ・成果物保存なし)。
# ubuntu-24.04 で全 patchset 適用 → configure --enable-archs=i386,x86_64 → make。

on:
  push:
    branches:
      - master
    paths:
      - 'patches/**'
      - 'patches/series.conf'
      - 'scripts/apply-patches.sh'
      - 'configure.ac'
      - 'dlls/**'
      - 'libs/**'
      - 'loader/**'
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'patches/series.conf'
      - 'scripts/apply-patches.sh'
      - 'configure.ac'
      - 'dlls/**'
      - 'libs/**'
      - 'loader/**'
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# 長時間ビルドの重複実行を防ぐ (upstream-sync とは別グループで競合なし)。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wow64:
    name: WOW64 build (i386,x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            gcc-multilib g++-multilib mingw-w64 \
            flex bison \
            libx11-dev libx11-dev:i386 \
            libfreetype-dev libfreetype-dev:i386 \
            libxcursor-dev libxcursor-dev:i386 \
            libxi-dev libxi-dev:i386 \
            libxinerama-dev libxinerama-dev:i386 \
            libxrandr-dev libxrandr-dev:i386 \
            libxrender-dev libxrender-dev:i386 \
            libxcomposite-dev libxcomposite-dev:i386 \
            libgl-dev libgl-dev:i386 \
            libdbus-1-dev libdbus-1-dev:i386 \
            libgnutls28-dev libgnutls28-dev:i386 \
            libncurses-dev libncurses-dev:i386 \
            libpulse-dev libpulse-dev:i386 \
            libudev-dev libudev-dev:i386 \
            libvulkan-dev libvulkan-dev:i386 \
            libunwind-dev libunwind-dev:i386 \
            libkrb5-dev \
            libsdl2-dev libsdl2-dev:i386 \
            libcups2-dev libcups2-dev:i386 \
            libgphoto2-dev libgphoto2-dev:i386 \
            libsane-dev libsane-dev:i386 \
            libgsm1-dev libgsm1-dev:i386 \
            libtiff-dev libtiff-dev:i386 \
            libjpeg-dev libjpeg-dev:i386 \
            libpng-dev libpng-dev:i386 \
            libfaudio-dev \
            liblcms2-dev liblcms2-dev:i386 \
            libmpg123-dev libmpg123-dev:i386 \
            libopenal-dev libopenal-dev:i386 \
            libodbc2 libodbc2:i386 unixodbc-dev unixodbc-dev:i386 \
            libusb-1.0-0-dev libusb-1.0-0-dev:i386 \
            libv4l-dev libv4l-dev:i386 \
            libgstreamer1.0-dev libgstreamer1.0-dev:i386 \
            libgstreamer-plugins-base1.0-dev

      - name: Apply all patchsets
        shell: bash
        run: bash scripts/apply-patches.sh --all

      - name: "Regenerate protocol headers (same as GE prep; autoreconf omitted: breaks top-level Makefile generation)"
        shell: bash
        run: ./tools/make_requests

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wow64-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-wow64-${{ github.head_ref || github.ref_name }}-
            ccache-wow64-master-

      - name: Configure (WOW64)
        shell: bash
        run: |
          ./configure --enable-archs=i386,x86_64 \
            CC="ccache gcc" \
            x86_64_CC="ccache x86_64-w64-mingw32-gcc" \
            i386_CC="ccache i686-w64-mingw32-gcc"

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          make -j"$(nproc)"

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wow64-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
