# series.conf — patchset apply order (top to bottom)
#
# One directory name per line, matching patches/<name>/.
# Blank lines and lines starting with '#' are ignored.
# Order matters: later patchsets apply on top of earlier ones.
#
# To disable a patchset temporarily, comment it out here
# (do NOT delete the directory). To exclude at apply time,
# use: scripts/apply-patches.sh --all -W <name>
#
# Format version: 1 (keep this file plain text, UTF-8, LF)

